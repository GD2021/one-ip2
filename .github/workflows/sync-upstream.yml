name: Sync upstream

on:
  schedule:
    # 每天 UTC 04:23 (北京时间 12:23) 定时同步
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/zhihui-hu/one-ip.git 2>/dev/null || true
          git fetch upstream main

          LOCAL_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse upstream/main)

          echo "Local SHA: $LOCAL_SHA"
          echo "Upstream SHA: $UPSTREAM_SHA"

          if [ "$LOCAL_SHA" = "$UPSTREAM_SHA" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi

          echo "Merging upstream/main..."
          if git merge upstream/main -m "chore: sync from upstream" --no-edit; then
            echo "Merged upstream cleanly."
          else
            echo "Merge conflict detected, falling back to upstream changes (-X theirs)..."
            git merge --abort || true
            git merge upstream/main -X theirs -m "chore: sync from upstream (resolved with theirs)" --no-edit
          fi

          # 保持 wrangler.toml 中的名称为 Cloudflare Worker 对应的 one-ip2
          sed -i.bak 's/name = "one-ip"/name = "one-ip2"/' wrangler.toml && rm -f wrangler.toml.bak
          if ! git diff --quiet wrangler.toml; then
            git add wrangler.toml
            git commit --amend --no-edit || git commit -m "chore: keep worker name as one-ip2"
          fi

          echo "Pushing changes to origin..."
          git push origin main
